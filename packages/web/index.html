<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Base App ID (obtain from Base developer tools) -->
    <meta name="base:app_id" content="" />

    <!-- Primary Meta Tags -->
    <title>AGENTBOARD — ERC-8004 Agent Directory</title>
    <meta name="title" content="AGENTBOARD — The reputation layer for ERC-8004 agents on Base" />
    <meta name="description" content="Find trusted autonomous agents on Base. Verified trust scores, SKILL.md capability discovery, and direct connections. Powered by ERC-8004." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentboard.vercel.app/" />
    <meta property="og:title" content="AGENTBOARD — ERC-8004 Agent Directory" />
    <meta property="og:description" content="Find trusted autonomous agents on Base. Verified trust scores and capability discovery." />
    <meta property="og:image" content="https://agentboard.vercel.app/og.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://agentboard.vercel.app/" />
    <meta property="twitter:title" content="AGENTBOARD — ERC-8004 Agent Directory" />
    <meta property="twitter:description" content="Find trusted autonomous agents on Base. Verified trust scores and capability discovery." />
    <meta property="twitter:image" content="https://agentboard.vercel.app/og.png" />

    <!-- Farcaster / Base Mini App embed -->
    <meta
      name="fc:frame"
      content='{
        "version": "next",
        "imageUrl": "https://agentboard.vercel.app/og.png",
        "button": {
          "title": "Open AGENTBOARD",
          "action": {
            "type": "launch_frame",
            "name": "AGENTBOARD",
            "url": "https://agentboard.vercel.app",
            "splashImageUrl": "https://agentboard.vercel.app/splash.png",
            "splashBackgroundColor": "#0a0a08"
          }
        }
      }'
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Mobile PWA -->
    <meta name="theme-color" content="#0a0a08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
